name: check
on:
  pull_request:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Manifests agree and content changes bump the version
        run: node scripts/plugin-version.mjs check origin/${{ github.base_ref }}
      - name: Claude plugin manifest is valid
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate ./plugins/lemondia --strict
          claude plugin validate ./.claude-plugin/marketplace.json
