name: release
on:
  push:
    branches: [main]
    paths: ['plugins/**']
permissions:
  contents: write
jobs:
  bump:
    # A push made by this workflow carries the bump already; the version check exits 0 for it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump the version when plugin content changed without one
        run: node scripts/plugin-version.mjs bump ${{ github.event.before }}
      - name: Commit and tag the bump
        run: |
          if git diff --quiet; then exit 0; fi
          VERSION=$(node -p "require('./plugins/lemondia/plugin.json').version")
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "chore: release lemondia plugin $VERSION"
          git tag "lemondia-v$VERSION"
          git push origin HEAD:main --tags
